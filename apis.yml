name: Agile Software
description: 'Agile Software Corporation was an American product lifecycle management (PLM) software company founded
  in 1995 and headquartered in San Jose, California. Backed by Accel, it IPO''d on the NASDAQ in 1999 and built
  enterprise software that helped manufacturers manage product records, bills of materials, engineering change orders,
  quality, compliance, and supply-chain data across a product''s development and production lifecycle. Oracle Corporation
  acquired Agile Software in July 2007 for approximately US$495 million; its products were rebranded as Oracle Agile
  PLM and folded into Oracle''s supply-chain and applications suite. The company no longer operates independently:
  agilesoft.com now redirects to Oracle, and the only surviving developer surface is the legacy Oracle Agile PLM
  SDK (a Java API set) hosted on docs.oracle.com. This profile is retained as an acquired/historical record; there
  is no live, independent public API surface to enrich.'
